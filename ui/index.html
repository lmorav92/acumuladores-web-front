 <script>
$(document).ready(function() {
    $("#login").click(function(e) {
        e.preventDefault(); // 🚨 MUY IMPORTANTE

        const username = $("#exampleInputUsername").val();
        const password = $("#exampleInputPassword").val();

       if (username === "" || password === "") {
            Swal.fire({
                title: 'Error',
                text: 'Por favor, completa todos los campos',
                icon: 'error',
                confirmButtonText: 'Aceptar'
            });
            return;
        }

        // Guardar datos en localStorage
    const sessionData = {
        user: username,
        role: username === "admin" ? "admin" : "user",
        loginTime: new Date().getTime(),
        lastActivity: new Date().getTime()
    };
    localStorage.setItem("session_mi_turno", JSON.stringify(sessionData));

        if (username === "admin") {
            Swal.fire({
                position: "top-end",
                title: 'Éxito',
                text: 'Has iniciado sesión correctamente como administrador',
                icon: 'success',
                showConfirmButton: false,
                timer: 1500
            }).then(() => {
                window.location.href = "ui/dashboard.html";
            });
        } else {
            Swal.fire({
                position: "top-end",
                title: 'Éxito',
                text: 'Has iniciado sesión correctamente como usuario',
                icon: 'success',
                showConfirmButton: false,
                timer: 1500
            }).then(() => {
                window.location.href = "ui/dashboard_user.html";
            });
        }
    });
});
</script>
